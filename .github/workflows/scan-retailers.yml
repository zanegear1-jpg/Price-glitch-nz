name: Scan NZ retailer feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: retailer-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Price Glitch NZ
        uses: actions/checkout@v4
      - name: Checkout unofficial retailer connectors
        uses: actions/checkout@v4
        with:
          repository: jason-s13r/shopping-cli-tools
          path: connector-source
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: connector-source
      - name: Build retailer search tools
        working-directory: connector-source
        run: |
          cargo install --path apps/mitre10-nz-cli --root "$HOME/.local"
          cargo install --path apps/kmart-cli --root "$HOME/.local"
          cargo install --path apps/the-warehouse-nz-cli --root "$HOME/.local"
          cargo install --path apps/farmers-nz-cli --root "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prepare Farmers browser runtime
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv tool install "camoufox[geoip]"
          camoufox fetch
      - name: Scan catalogues and specials
        run: python scripts/scan_retailers.py
      - name: Publish feed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json
          if git diff --cached --quiet; then
            echo "No feed changes to publish."
          else
            git commit -m "chore: refresh retailer feed snapshot"
            git push
          fi
